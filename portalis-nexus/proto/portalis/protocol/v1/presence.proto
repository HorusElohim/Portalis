syntax = "proto3";

package portalis.protocol.v1;

// A friend's availability, aggregated across all of their devices.
//
// Presence is derived from live connections rather than stored, and is only
// ever sent to users authorized to see it.
message PresenceEvent {
  bytes user_id = 1;
  bool online = 2;
  // When the user was last seen online, absent while they still are.
  optional uint64 last_seen_unix_ms = 3;
}
